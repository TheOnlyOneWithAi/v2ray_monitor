<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>V2Ray Monitor</title><link rel="stylesheet" href="/static/style.css"><script src="https://telegram.org/js/telegram-web-app.js"></script></head><body><main><header><div><h1>V2Ray Monitor</h1><p id="updated">در حال بارگذاری…</p></div><button id="refresh" type="button">↻</button></header><section id="account" class="account"></section><section class="toolbar"><input id="search" placeholder="جستجو بر اساس نام کانفیگ…"><button id="add" type="button">+ افزودن کانفیگ</button></section><p id="access" class="empty"></p><section id="nodes" aria-live="polite"></section><dialog id="dialog"><form method="dialog" id="configForm"><h2>افزودن کانفیگ</h2><input id="name" required maxlength="200" placeholder="نام کانفیگ"><select id="protocol"><option>vless</option><option>vmess</option><option>trojan</option><option>shadowsocks</option></select><textarea id="config" required placeholder='JSON کانفیگ Xray، مثال: {"address":"example.com","port":443,"uuid":"..."}'></textarea><div><button value="cancel">لغو</button><button id="save" value="default">ذخیره</button></div></form></dialog></main><script src="/static/app.js" defer></script></body></html>
