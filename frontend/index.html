<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>V2Ray Monitor</title><link rel="stylesheet" href="/static/style.css"><script src="https://telegram.org/js/telegram-web-app.js"></script></head><body><main><header><div><h1>V2Ray Monitor</h1><p id="updated">در حال بارگذاری…</p></div><button id="refresh" type="button">↻</button></header><section id="account" class="account"></section><section class="toolbar"><input id="search" placeholder="جستجو بین کانفیگ‌ها…"><button id="add" type="button">+ افزودن اشتراک</button></section><section id="subscriptions" class="subscriptions"></section><p id="access" class="empty"></p><section id="nodes" aria-live="polite"></section><dialog id="dialog"><form method="dialog" id="subscriptionForm"><h2>افزودن Subscription</h2><p>لینک اشتراک را وارد کن؛ Monitor خودش همه کانفیگ‌ها را استخراج و دوره‌ای بروزرسانی می‌کند.</p><input id="name" required maxlength="120" placeholder="نام اشتراک، مثلاً پنل اصلی"><input id="url" required type="url" maxlength="4096" placeholder="https://example.com/sub/..."><div><button value="cancel">لغو</button><button id="save" value="default">استخراج کانفیگ‌ها</button></div></form></dialog></main><script src="/static/app.js" defer></script></body></html>
